# SPIKE TEST S3: a workflow on the change's own branch whose job is named like the kit's required check.
# If this alone lets the pull request merge, a branch can forge the kit's check.
name: forge
on: [pull_request]
permissions:
  contents: read
jobs:
  forge:
    name: FoundationGuard note
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "I am not the kit."
